name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # Uploads dist/ as a downloadable artifact on every run — doesn't deploy
      # anywhere by itself. Wire up actions/deploy-pages or your GitHub Pages
      # publish step here once you're ready to auto-deploy on merge to main.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

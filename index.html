    <!-- GitHub Pages SPA fallback: decodes the path 404.html redirected here with,
         and restores the real URL via replaceState before React mounts/renders,
         so a direct visit to e.g. /services lands on the right page. -->
    <script>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("redirect");
        if (redirect) {
          window.history.replaceState({}, "", redirect);
        }
      })();
    </script>
